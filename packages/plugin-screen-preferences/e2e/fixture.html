<!doctype html>
<meta charset="utf-8" />
<title>Plugin fixture</title>
<canvas id="game" width="100" height="100" style="display: block"></canvas>
<script type="module">
  import { Gamingalo } from '/sdk/dist/index.js';
  import { screenPreferences } from '/plugin-screen-preferences/dist/index.js';

  const canvas = document.getElementById('game');
  const context = canvas.getContext('2d');
  context.fillStyle = 'rgb(100, 100, 100)';
  context.fillRect(0, 0, 100, 100);

  const screen = screenPreferences();
  window.sdk = await Gamingalo.init({ gameId: 'screen', realm: { canvas }, plugins: [screen], modules: ['accessibility'] });
  window.screenApi = window.sdk.use(screen);
  window.ready = true;
</script>
