name: Docs

# Builds the documentation and publishes it to GitHub Pages on every push to master.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        env:
          # Pages serves a project site from /<repository>.
          DOCS_BASE_PATH: /${{ github.event.repository.name }}
        run: npx nx run @gamingalo/docs:build
      # Without this, Pages runs Jekyll, which drops folders such as _next.
      - run: touch apps/docs/out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
